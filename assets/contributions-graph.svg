<svg width="100%" height="220" viewBox="0 0 840 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="840" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad2" x1="0" y1="0" x2="840" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
    </linearGradient>

    <!-- Wave Fill Gradient -->
    <linearGradient id="waveFill" x1="0" y1="40" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.0" />
    </linearGradient>

    <!-- Wave Stroke Gradient -->
    <linearGradient id="waveStroke" x1="360" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="836" height="216" rx="14" fill="url(#bgGrad2)" stroke="url(#borderGrad2)" stroke-width="1.2" />

  <!-- Profile Title -->
  <text x="32" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">dianatofficial (Mohammad Javad Dianat)</text>
  <text x="790" y="36" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="end">Engineering Activity &amp; Velocity</text>
  <line x1="32" y1="48" x2="808" y2="48" stroke="#1e293b" stroke-width="1" />

  <!-- Left Stats Summary -->
  <g transform="translate(32, 72)">
    <!-- Item 1: Contributions -->
    <text x="0" y="16" fill="#c084fc" font-family="sans-serif" font-size="14">🐙</text>
    <text x="24" y="16" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">4,500+ Contributions on GitHub</text>

    <!-- Item 2: Public Repos -->
    <text x="0" y="44" fill="#38bdf8" font-family="sans-serif" font-size="14">📦</text>
    <text x="24" y="44" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">60+ Public Repositories</text>

    <!-- Item 3: University -->
    <text x="0" y="72" fill="#10b981" font-family="sans-serif" font-size="14">🎓</text>
    <text x="24" y="72" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">University of Tehran</text>

    <!-- Item 4: Achievements -->
    <text x="0" y="100" fill="#f59e0b" font-family="sans-serif" font-size="14">🏆</text>
    <text x="24" y="100" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Pair Extraordinaire (Gold) · Pull Shark (Silver)</text>
  </g>

  <!-- Right Chart Area -->
  <g transform="translate(0, 0)">
    <!-- Horizontal Gridlines -->
    <line x1="360" y1="80" x2="770" y2="80" stroke="#1e293b" stroke-dasharray="3 3" stroke-width="1" />
    <line x1="360" y1="120" x2="770" y2="120" stroke="#1e293b" stroke-dasharray="3 3" stroke-width="1" />
    <line x1="360" y1="160" x2="770" y2="160" stroke="#1e293b" stroke-width="1" />

    <!-- Wave Fill -->
    <path d="M 360 160 
             C 400 155, 430 135, 460 130 
             C 490 125, 520 145, 550 115 
             C 580 85, 610 50, 645 55 
             C 680 60, 710 100, 740 90 
             C 760 85, 780 120, 800 160 
             Z" fill="url(#waveFill)" />

    <!-- Wave Stroke -->
    <path d="M 360 160 
             C 400 155, 430 135, 460 130 
             C 490 125, 520 145, 550 115 
             C 580 85, 610 50, 645 55 
             C 680 60, 710 100, 740 90 
             C 760 85, 780 120, 800 160" 
          fill="none" stroke="url(#waveStroke)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Glow Point on Peak -->
    <circle cx="645" cy="55" r="4.5" fill="#c084fc" />
    <circle cx="645" cy="55" r="8" fill="#c084fc" fill-opacity="0.3" />

    <!-- Month Axis Labels -->
    <text x="360" y="180" fill="#64748b" font-family="sans-serif" font-size="11">Q1</text>
    <text x="460" y="180" fill="#64748b" font-family="sans-serif" font-size="11">Q2</text>
    <text x="560" y="180" fill="#64748b" font-family="sans-serif" font-size="11">Q3</text>
    <text x="660" y="180" fill="#64748b" font-family="sans-serif" font-size="11">Q4</text>
    <text x="760" y="180" fill="#64748b" font-family="sans-serif" font-size="11">Present</text>

    <!-- Right Y-Axis Scale -->
    <text x="805" y="84" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="start">High</text>
    <text x="805" y="124" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="start">Med</text>
    <text x="805" y="164" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="start">0</text>
  </g>
</svg>

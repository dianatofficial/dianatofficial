<svg width="100%" height="220" viewBox="0 0 840 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="840" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="840" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="450" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 50) rotate(45) scale(220 180)">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 160) rotate(135) scale(200 150)">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="836" height="216" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="836" height="216" rx="16" fill="url(#glow)" />
  <rect x="2" y="2" width="836" height="216" rx="16" fill="url(#glow2)" />

  <!-- Terminal Window Controls -->
  <circle cx="28" cy="26" r="5.5" fill="#ef4444" fill-opacity="0.85" />
  <circle cx="46" cy="26" r="5.5" fill="#eab308" fill-opacity="0.85" />
  <circle cx="64" cy="26" r="5.5" fill="#10b981" fill-opacity="0.85" />

  <!-- Terminal Title / Path -->
  <text x="86" y="30" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">dianatofficial / profile.config</text>

  <!-- Main Name Header -->
  <text x="32" y="80" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Mohammad Javad Dianat</text>

  <!-- Role Subtitle -->
  <text x="32" y="112" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">
    Senior Full-Stack &amp; Data/AI Engineer
  </text>
  <text x="32" y="134" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
    From Scalable Data Pipelines to Production Intelligent Systems &amp; RAG Architecture
  </text>

  <!-- Modern Accent Chips -->
  <!-- Chip 1: AI / RAG -->
  <g transform="translate(32, 160)">
    <rect width="135" height="30" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" />
    <text x="67" y="19" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧠 LLM &amp; RAG Systems</text>
  </g>

  <!-- Chip 2: Data Engineering -->
  <g transform="translate(177, 160)">
    <rect width="145" height="30" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4" />
    <text x="72" y="19" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Data Pipelines / ETL</text>
  </g>

  <!-- Chip 3: MLOps -->
  <g transform="translate(332, 160)">
    <rect width="130" height="30" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" stroke-opacity="0.4" />
    <text x="65" y="19" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚀 Production MLOps</text>
  </g>

  <!-- Chip 4: High Throughput Backend -->
  <g transform="translate(472, 160)">
    <rect width="160" height="30" rx="8" fill="#2e1065" stroke="#9333ea" stroke-width="1" stroke-opacity="0.4" />
    <text x="80" y="19" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛠️ Distributed Backend</text>
  </g>

  <!-- Chip 5: Multilingual NLP -->
  <g transform="translate(642, 160)">
    <rect width="165" height="30" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1" stroke-opacity="0.4" />
    <text x="82" y="19" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔍 Multilingual NLP &amp; LLMs</text>
  </g>
</svg>

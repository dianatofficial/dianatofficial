<svg width="100%" height="200" viewBox="0 0 840 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="405" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#080b14" />
    </linearGradient>
    <linearGradient id="borderLeft" x1="0" y1="0" x2="405" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="borderRight" x1="0" y1="0" x2="405" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    
    <!-- Octocat Glow -->
    <linearGradient id="octoGlow" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- ================= LEFT CARD: STATS ================= -->
  <g transform="translate(2, 2)">
    <rect width="405" height="196" rx="14" fill="url(#cardGrad)" stroke="url(#borderLeft)" stroke-width="1.2" />
    
    <!-- Card Header -->
    <text x="25" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Engineering Stats</text>
    <line x1="25" y1="44" x2="380" y2="44" stroke="#1e293b" stroke-width="1" />
    
    <!-- Metrics List -->
    <!-- Metric 1: Stars -->
    <text x="25" y="74" fill="#94a3b8" font-family="sans-serif" font-size="13">⭐ Total Stars Earned:</text>
    <text x="195" y="74" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">51+</text>
    
    <!-- Metric 2: Commits -->
    <text x="25" y="100" fill="#94a3b8" font-family="sans-serif" font-size="13">📦 Production Commits:</text>
    <text x="195" y="100" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">1.8k+</text>
    
    <!-- Metric 3: Merged PRs -->
    <text x="25" y="126" fill="#94a3b8" font-family="sans-serif" font-size="13">🦈 Merged Pull Requests:</text>
    <text x="195" y="126" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">131 (Silver Tier)</text>
    
    <!-- Metric 4: Collabs -->
    <text x="25" y="152" fill="#94a3b8" font-family="sans-serif" font-size="13">👯 Pair Collaborations:</text>
    <text x="195" y="152" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700">50+ (Gold Tier)</text>

    <!-- Metric 5: Contributed to -->
    <text x="25" y="178" fill="#94a3b8" font-family="sans-serif" font-size="13">🌐 Contributed Projects:</text>
    <text x="195" y="178" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">48+ Repos</text>
    
    <!-- Octocat Watermark Silhouette -->
    <g transform="translate(290, 65)">
      <circle cx="45" cy="45" r="42" fill="url(#octoGlow)" />
      <path d="M45 15C28.43 15 15 28.43 15 45C15 58.26 23.6 69.49 35.53 73.46C37.03 73.73 37.58 72.81 37.58 72.01C37.58 71.3 37.55 69.42 37.54 66.92C29.2 68.73 27.44 62.89 27.44 62.89C26.08 59.43 24.12 58.51 24.12 58.51C21.4 56.65 24.32 56.69 24.32 56.69C27.33 56.9 28.91 59.78 28.91 59.78C31.58 64.36 35.92 63.04 37.63 62.27C37.9 60.34 38.67 59.02 39.52 58.27C32.86 57.51 25.86 54.94 25.86 43.46C25.86 40.19 27.03 37.51 28.95 35.42C28.64 34.66 27.62 31.62 29.25 27.5C29.25 27.5 31.77 26.69 37.5 30.58C39.9 29.91 42.45 29.58 45 29.57C47.55 29.58 50.1 29.91 52.5 30.58C58.23 26.69 60.75 27.5 60.75 27.5C62.38 31.62 61.36 34.66 61.05 35.42C62.97 37.51 64.14 40.19 64.14 43.46C64.14 54.98 57.12 57.5 50.44 58.24C51.52 59.17 52.48 61 52.48 63.78C52.48 67.76 52.44 70.97 52.44 71.95C52.44 72.76 52.98 73.71 54.51 73.41C66.41 69.41 75 58.22 75 45C75 28.43 61.57 15 45 15Z" fill="#a855f7" fill-opacity="0.75" />
    </g>
  </g>

  <!-- ================= RIGHT CARD: LANGUAGES ================= -->
  <g transform="translate(433, 2)">
    <rect width="405" height="196" rx="14" fill="url(#cardGrad)" stroke="url(#borderRight)" stroke-width="1.2" />
    
    <!-- Card Header -->
    <text x="25" y="34" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Top Languages by Domain</text>
    <line x1="25" y1="44" x2="380" y2="44" stroke="#1e293b" stroke-width="1" />
    
    <!-- Donut Chart -->
    <!-- Circumference of r=48 is 2 * PI * 48 = 301.6 -->
    <g transform="translate(100, 118)">
      <!-- Background Track -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#1e293b" stroke-width="20" />
      
      <!-- Python: 46% = 138.7 -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#38bdf8" stroke-width="20" stroke-dasharray="138.7 301.6" stroke-dashoffset="0" transform="rotate(-90)" />
      
      <!-- TypeScript / Next.js: 28% = 84.4 -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#818cf8" stroke-width="20" stroke-dasharray="84.4 301.6" stroke-dashoffset="-138.7" transform="rotate(-90)" />
      
      <!-- Go & Backend: 16% = 48.2 -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#10b981" stroke-width="20" stroke-dasharray="48.2 301.6" stroke-dashoffset="-223.1" transform="rotate(-90)" />
      
      <!-- SQL / ETL: 10% = 30.1 -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#f59e0b" stroke-width="20" stroke-dasharray="30.1 301.6" stroke-dashoffset="-271.3" transform="rotate(-90)" />
      
      <!-- Center Text -->
      <text x="0" y="4" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">TECH</text>
    </g>

    <!-- Legend -->
    <g transform="translate(200, 68)">
      <!-- Python -->
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#38bdf8" />
      <text x="20" y="11" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="500">Python</text>
      <text x="140" y="11" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="end">46%</text>

      <!-- TypeScript -->
      <rect x="0" y="26" width="12" height="12" rx="3" fill="#818cf8" />
      <text x="20" y="37" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="500">TypeScript / UI</text>
      <text x="140" y="37" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="end">28%</text>

      <!-- Go -->
      <rect x="0" y="52" width="12" height="12" rx="3" fill="#10b981" />
      <text x="20" y="63" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="500">Go (Golang)</text>
      <text x="140" y="63" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="end">16%</text>

      <!-- SQL -->
      <rect x="0" y="78" width="12" height="12" rx="3" fill="#f59e0b" />
      <text x="20" y="89" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="500">SQL &amp; Pipelines</text>
      <text x="140" y="89" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="end">10%</text>
    </g>
  </g>
</svg>

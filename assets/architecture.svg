<svg width="100%" height="240" viewBox="0 0 840 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="840" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="cardBorder" x1="0" y1="0" x2="840" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="innerBorder1" x1="0" y1="0" x2="250" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="innerBorder2" x1="0" y1="0" x2="250" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="innerBorder3" x1="0" y1="0" x2="250" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="836" height="236" rx="14" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />

  <!-- Section Header -->
  <text x="30" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ARCHITECTURAL DOMAINS &amp; PRODUCTION BENCHMARKS</text>
  <line x1="30" y1="44" x2="810" y2="44" stroke="#1e293b" stroke-width="1" />

  <!-- Card 1: AI & RAG Engineering -->
  <g transform="translate(30, 60)">
    <rect width="245" height="155" rx="10" fill="#0f172a" stroke="url(#innerBorder1)" stroke-width="1" />
    <circle cx="24" cy="26" r="10" fill="#4338ca" fill-opacity="0.3" />
    <text x="24" y="30" fill="#a5b4fc" font-family="sans-serif" font-size="12" text-anchor="middle">🧠</text>
    <text x="44" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">AI &amp; RAG Systems</text>
    
    <text x="16" y="62" fill="#94a3b8" font-family="sans-serif" font-size="12">• LLM Orchestration &amp; Eval</text>
    <text x="16" y="84" fill="#94a3b8" font-family="sans-serif" font-size="12">• Context &amp; Vector Retrieval</text>
    <text x="16" y="106" fill="#94a3b8" font-family="sans-serif" font-size="12">• Persian Linguistic NLP</text>
    
    <rect x="16" y="122" width="213" height="22" rx="5" fill="#1e1b4b" />
    <text x="122" y="137" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ ~70% Low-Latency Retrieval</text>
  </g>

  <!-- Card 2: Data Engineering & ETL -->
  <g transform="translate(295, 60)">
    <rect width="245" height="155" rx="10" fill="#0f172a" stroke="url(#innerBorder2)" stroke-width="1" />
    <circle cx="24" cy="26" r="10" fill="#0369a1" fill-opacity="0.3" />
    <text x="24" y="30" fill="#7dd3fc" font-family="sans-serif" font-size="12" text-anchor="middle">⚡</text>
    <text x="44" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Data Engineering</text>
    
    <text x="16" y="62" fill="#94a3b8" font-family="sans-serif" font-size="12">• Apache Airflow Pipelines</text>
    <text x="16" y="84" fill="#94a3b8" font-family="sans-serif" font-size="12">• Distributed Data Streams</text>
    <text x="16" y="106" fill="#94a3b8" font-family="sans-serif" font-size="12">• PostgreSQL &amp; Vector Stores</text>
    
    <rect x="16" y="122" width="213" height="22" rx="5" fill="#082f49" />
    <text x="122" y="137" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔄 Automated Scalable ETL</text>
  </g>

  <!-- Card 3: Backend & Full-Stack -->
  <g transform="translate(565, 60)">
    <rect width="245" height="155" rx="10" fill="#0f172a" stroke="url(#innerBorder3)" stroke-width="1" />
    <circle cx="24" cy="26" r="10" fill="#047857" fill-opacity="0.3" />
    <text x="24" y="30" fill="#6ee7b7" font-family="sans-serif" font-size="12" text-anchor="middle">🛠️</text>
    <text x="44" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Production Systems</text>
    
    <text x="16" y="62" fill="#94a3b8" font-family="sans-serif" font-size="12">• Python (FastAPI) &amp; Go Backends</text>
    <text x="16" y="84" fill="#94a3b8" font-family="sans-serif" font-size="12">• Next.js &amp; TypeScript UIs</text>
    <text x="16" y="106" fill="#94a3b8" font-family="sans-serif" font-size="12">• Docker Containerization</text>
    
    <rect x="16" y="122" width="213" height="22" rx="5" fill="#064e3b" />
    <text x="122" y="137" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🎯 ~91% NLP Benchmark Accuracy</text>
  </g>
</svg>

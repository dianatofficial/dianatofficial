# Copy this file to `.github/workflows/update-stats.yml` via GitHub Web UI
# (or after running `gh auth refresh -h github.com -s workflow` locally)
# to enable 100% automatic daily updates of your profile SVG cards.

name: Update Profile Analytics Cards

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours automatically on GitHub Actions
  workflow_dispatch:       # Allows manual 1-click trigger from Actions tab

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate live SVG analytics cards
        env:
          # Optional: add GH_STATS_TOKEN in Repo Secrets (read:user + repo)
          # to include private repo commits/contributions alongside public stats.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_profile_cards.py

      - name: Commit updated SVG cards if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-and-languages.svg assets/contributions-graph.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): sync live GitHub stats & charts"
            git push
          else
            echo "No stat changes to commit."
          fi
